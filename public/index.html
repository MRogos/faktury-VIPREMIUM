<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Sterowania · VIPREMIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;
    --bg-grid:#11151d;
    --panel:#141922;
    --panel-hi:#1a212c;
    --line:#232c39;
    --line-hi:#33465c;
    --text:#e7edf5;
    --muted:#7d8da0;
    --dim:#556074;
    --amber:#f6b23d;
    --amber-glow:rgba(246,178,61,.35);

    --c-tacho:#4c9bf0;
    --c-warsztat:#f5883b;
    --c-tms:#3fc98a;
    --c-faktury:#a97bf0;
    --c-fuel:#2fc4c4;
    --c-raporty:#ef4444;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}

  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.5;
    background-image:
      linear-gradient(var(--bg-grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
    background-size:44px 44px;
    background-position:center top;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:clamp(24px,5vw,56px) clamp(18px,4vw,40px) 48px;
  }

  /* ---------- HEADER / DEPARTURE BOARD ---------- */
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }

  .brand-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--c-tms);
    box-shadow:0 0 0 0 rgba(63,201,138,.5);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,201,138,.45)}
    70%{box-shadow:0 0 0 7px rgba(63,201,138,0)}
    100%{box-shadow:0 0 0 0 rgba(63,201,138,0)}
  }

  .brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(30px,6vw,46px);
    letter-spacing:-.02em;
    line-height:1;
  }
  .brand-name b{color:var(--amber);font-weight:700}
  .brand-sub{
    font-size:13px;
    color:var(--muted);
    margin-top:9px;
    letter-spacing:.04em;
  }

  .board{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
  }
  .board-clock{
    font-size:clamp(26px,5vw,38px);
    font-weight:700;
    color:var(--amber);
    letter-spacing:.06em;
    text-shadow:0 0 22px var(--amber-glow);
    font-variant-numeric:tabular-nums;
  }
  .board-clock .sep{opacity:.4;animation:blink 1.05s step-end infinite}
  @keyframes blink{50%{opacity:.08}}
  .board-date{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--dim);
    margin-top:4px;
  }

  /* ---------- SECTION LABEL ---------- */
  .sec-label{
    display:flex;align-items:center;gap:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:22px;
  }
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .sec-label span{color:var(--muted)}

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }

  .tile{
    --c:var(--amber);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 22px 20px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:transform .18s ease,border-color .18s ease,background .18s ease;
  }
  .tile::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;
    width:3px;
    background:var(--c);
    opacity:.7;
    transition:width .18s ease,opacity .18s ease;
  }
  .tile:hover,.tile:focus-visible{
    transform:translateY(-4px);
    border-color:var(--line-hi);
    background:var(--panel-hi);
    outline:none;
  }
  .tile:hover::before,.tile:focus-visible::before{width:5px;opacity:1}
  .tile:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}

  .tile-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .tile-icon{
    width:46px;height:46px;
    border-radius:11px;
    display:grid;place-items:center;
    background:color-mix(in srgb,var(--c) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
    color:var(--c);
  }
  .tile-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .tile-status{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  .tile-status i{
    width:6px;height:6px;border-radius:50%;
    background:var(--c);
    display:inline-block;
  }

  .tile-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:21px;
    letter-spacing:-.01em;
    margin-bottom:5px;
  }
  .tile-desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    min-height:38px;
  }

  .tile-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .tile-url{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--dim);
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tile-arrow{
    color:var(--c);
    display:grid;place-items:center;
    flex-shrink:0;
    transition:transform .18s ease;
  }
  .tile-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tile:hover .tile-arrow{transform:translateX(4px)}

  .tile[data-missing="1"]{opacity:.62}
  .tile[data-missing="1"] .tile-status{color:var(--amber)}
  .tile[data-missing="1"] .tile-status i{background:var(--amber);animation:blink 1.2s step-end infinite}

  /* ---------- FOOTER ---------- */
  footer{
    margin-top:44px;
    padding-top:22px;
    border-top:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:12px 28px;
    align-items:center;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--dim);
  }
  footer .stat b{color:var(--muted);font-weight:700}

  @media (max-width:560px){
    header{align-items:flex-start}
    .board{text-align:left}
    .grid{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-eyebrow"><span class="live-dot"></span>Panel Sterowania</div>
      <div class="brand-name">VI<b>PREMIUM</b></div>
      <div class="brand-sub">Systemy wewnętrzne grupy · Transport &amp; Logistyka</div>
    </div>
    <div class="board">
      <div class="board-clock" id="clock">--<span class="sep">:</span>--<span class="sep">:</span>--</div>
      <div class="board-date" id="date">—</div>
    </div>
  </header>

  <div class="sec-label"><span>Aplikacje</span></div>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="stat"><b id="count">0</b> systemów · <b>1</b> panel</div>
    <div>programy.vipremium.pl</div>
  </footer>

</div>

<script>
/* ====================================================================
   KONFIGURACJA — tu edytujesz linki. Jedna linijka na apkę.
   url:"" => kafel oznaczony jako "brak linku" (do uzupełnienia).
   ==================================================================== */
const APPS = [
  {
    id:"tacho",
    name:"Tacho",
    desc:"Analiza wykresówek i czasu pracy kierowców. Doby, okresy odpoczynku, zgodność 561/2006.",
    url:"https://tacho.vipremium.pl",
    color:"var(--c-tacho)",
    icon:"gauge"
  },
  {
    id:"warsztat",
    name:"Warsztat",
    desc:"Zlecenia serwisowe, magazyn części, karta warsztatowa mechanika, KSeF i faktury.",
    url:"https://warsztat.vipremium.pl",
    color:"var(--c-warsztat)",
    icon:"wrench"
  },
  {
    id:"tms",
    name:"TMS",
    desc:"Zlecenia transportowe, flota, kierowcy, kontrahenci, faktury z kursami NBP.",
    url:"https://premium-tms.com",
    color:"var(--c-tms)",
    icon:"truck"
  },
  {
    id:"faktury",
    name:"Faktury",
    desc:"Ewidencja faktur czterech spółek, skan AI, VAT-REF, eliminacje intercompany.",
    url:"https://faktury-vipremium.onrender.com",
    color:"var(--c-faktury)",
    icon:"invoice"
  },
  {
    id:"fuel",
    name:"Tankowania",
    desc:"FleetFuel — rozliczenia paliwa, import AS24 / Tankpool / Citronex, rabaty i odcinki.",
    url:"https://fleetfuel-vipremium.onrender.com",
    color:"var(--c-fuel)",
    icon:"fuel"
  },
  {
    id:"raporty",
    name:"Raporty",
    desc:"Raporty finansowe floty — wprowadzanie tras, obroty, koszty i wyniki per pojazd.",
    url:"https://raporty.vipremium.pl",
    color:"var(--c-raporty)",
    icon:"barchart"
  }
];

const ICONS = {
  gauge:'<svg viewBox="0 0 24 24"><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="m13.4 10.6 3.6-3.6"/><path d="M4.5 18a9 9 0 1 1 15 0"/></svg>',
  wrench:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5l-1.6 1.6a1 1 0 0 0 0 1.4l4.9 4.9a2.1 2.1 0 0 1-3 3l-4.9-4.9a1 1 0 0 0-1.4 0L6.3 11.7a4 4 0 0 1-5-5l3 3 2.1-2.1-3-3a4 4 0 0 1 5 5z"/></svg>',
  truck:'<svg viewBox="0 0 24 24"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>',
  invoice:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M8 11h8M8 15h5"/></svg>',
  fuel:'<svg viewBox="0 0 24 24"><path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15"/><path d="M3 20h12"/><path d="M8 9h6"/><path d="M14 8h2.5a1.5 1.5 0 0 1 1.5 1.5V15a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9l-3-3"/></svg>',
  barchart:'<svg viewBox="0 0 24 24"><path d="M3 3v17a1 1 0 0 0 1 1h17"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="4" width="3" height="13"/></svg>'
};

const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function render(){
  const grid=document.getElementById("grid");
  let live=0;
  grid.innerHTML=APPS.map(a=>{
    const missing=!a.url;
    if(!missing) live++;
    const host=missing?"link do uzupełnienia":a.url.replace(/^https?:\/\//,"").replace(/\/$/,"");
    const statusTxt=missing?"Brak linku":"Online";
    return `
      <a class="tile" href="${missing?'#':a.url}" ${missing?'':'target="_blank" rel="noopener"'} data-missing="${missing?1:0}" style="--c:${a.color}">
        <div class="tile-top">
          <div class="tile-icon">${ICONS[a.icon]}</div>
          <div class="tile-status"><i></i>${statusTxt}</div>
        </div>
        <div class="tile-name">${a.name}</div>
        <div class="tile-desc">${a.desc}</div>
        <div class="tile-foot">
          <div class="tile-url">${host}</div>
          <div class="tile-arrow">${arrow}</div>
        </div>
      </a>`;
  }).join("");
  document.getElementById("count").textContent=live;
}

const DNI=["Niedziela","Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota"];
const MIES=["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
function tick(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  document.getElementById("clock").innerHTML=
    `${p(d.getHours())}<span class="sep">:</span>${p(d.getMinutes())}<span class="sep">:</span>${p(d.getSeconds())}`;
  document.getElementById("date").textContent=
    `${DNI[d.getDay()]} · ${d.getDate()} ${MIES[d.getMonth()]} ${d.getFullYear()}`;
}

render();
tick();
setInterval(tick,1000);
</script>
</body>
</html>
